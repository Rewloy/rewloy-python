# Every push and pull request: install, type-check and test, on Python 3.9 and
# 3.13, then build the package and try the wheel in a clean environment. The
# tests need no network: the API is a local stub.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # No `python_version` in the mypy config: each job checks for its own interpreter (mypy 2 cannot target 3.9;
      # pip gives the 3.9 job mypy 1.x).
      - run: python -m mypy
      - run: python -m pytest

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the wheel somewhere else and use it
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/python" -c "
          import rewloy, importlib.resources as r
          assert rewloy.__version__ == '0.2.0', rewloy.__version__
          assert len(rewloy.OPERATIONS) > 200
          assert r.files('rewloy').joinpath('py.typed').is_file()
          assert rewloy.Rewloy(api_key='rwk_x').pass_action
          print('ok', rewloy.__version__, len(rewloy.OPERATIONS), 'operations')
          "
      - name: What the packages hold
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile
          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          sdist = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          for needle in ("rewloy/py.typed", "rewloy/generated/methods.py", "licenses/LICENSE"):
              assert any(n.endswith(needle) for n in wheel), needle
          for needle in ("openapi/openapi.json", "scripts/generator.py", "CHANGELOG.md", "tests/test_client.py"):
              assert any(n.endswith(needle) for n in sdist), needle
          assert not any(".venv" in n or "__pycache__" in n for n in wheel + sdist)
          print(len(wheel), "files in the wheel,", len(sdist), "in the sdist")
          PY
